; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rpipico2

[env]
test_framework = unity


check_tool = clangtidy, cppcheck
check_flags =
    clangtidy: --checks=-*,bugprone-*,modernize-*,readability-* --fix
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>
    +<test/>

; build_flags =
;     -Wall
;     -Wextra
;     -Wpedantic
;     -Wshadow
;     -Wundef

[env:native]
platform = native
test_framework = unity
test_filter = test_native
test_build_src = yes

build_src_filter =
    +<engine/note_lifecycle.cpp>
    +<engine/playback.cpp>
    +<engine/session.cpp>
    +<engine/step_planner.cpp>
    +<engine/sequencer.cpp>
    +<engine/diagnostics_serializer.cpp>
    +<input/>
    +<program/>

build_flags =
    ${env.build_flags}
    -std=gnu++17
    ; Exercise optional fault-command handling in native lifecycle tests.
    -DSWING_METRO_STAGE5_FAULT_SCENARIOS=1
    -I src
    -I lib/Encoder/src


[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1MB
monitor_speed = 115200

build_flags = 
    ${env.build_flags}
    -DUSE_TINYUSB
    -DLV_CONF_SKIP
    -DLV_FONT_MONTSERRAT_8=1
    -DLV_FONT_MONTSERRAT_10=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_MEM_SIZE=163840

lib_deps =
      moononournation/GFX Library for Arduino
      lvgl/lvgl

[env:rpipico2-stage5-instrumentation-off]
extends = env:rpipico2
build_flags =
    ${env:rpipico2.build_flags}
    -DSWING_METRO_STAGE5_INSTRUMENTATION=0

[env:rpipico2-stage5-fault-scenarios]
extends = env:rpipico2
build_flags =
    ${env:rpipico2.build_flags}
    -DSWING_METRO_STAGE5_FAULT_SCENARIOS=1
