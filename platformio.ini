; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rpipico2

[env]
; extra_scripts = pre:scripts/enable_toolchain_includes.py

test_framework = unity


check_tool = clangtidy, cppcheck
check_flags =
    clangtidy: --checks=-*,bugprone-*,modernize-*,readability-* --fix
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>
    +<test/>

; build_flags =
;     -Wall
;     -Wextra
;     -Wpedantic
;     -Wshadow
;     -Wundef

[env:native]
platform = native
test_framework = unity
test_filter = test_native
test_build_src = yes

build_src_filter =
    +<engine/sequencer.cpp>
    +<input/>
    +<program/>

build_flags =
    ${env.build_flags}
    -std=gnu++17
    -I src
    -I lib/Encoder/src


[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64KB
monitor_speed = 115200

build_src_filter =
    +<*>
    -<migration/*>

build_flags = 
    ${env.build_flags}
    -DUSE_TINYUSB
    -DLV_CONF_SKIP

lib_deps =
      moononournation/GFX Library for Arduino
      lvgl/lvgl

[env:migrate-export-64k]
platform = ${env:rpipico2.platform}
board = ${env:rpipico2.board}
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64KB
build_src_filter =
    -<*>
    +<migration/main.cpp>
    +<drivers/littlefs_program_storage.cpp>
build_flags =
    ${env.build_flags}
    -DMIGRATION_EXPORT_ONLY

[env:migrate-restore-1m]
platform = ${env:rpipico2.platform}
board = ${env:rpipico2.board}
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 1MB
build_src_filter =
    -<*>
    +<migration/main.cpp>
    +<drivers/littlefs_program_storage.cpp>
build_flags =
    ${env.build_flags}
    -DMIGRATION_RESTORE_ONLY

[env:migrate-restore-64k]
platform = ${env:rpipico2.platform}
board = ${env:rpipico2.board}
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64KB
build_src_filter =
    -<*>
    +<migration/main.cpp>
    +<drivers/littlefs_program_storage.cpp>
build_flags =
    ${env.build_flags}
    -DMIGRATION_RESTORE_ONLY

[env:rpipico2-1m]
extends = env:rpipico2
board_build.filesystem_size = 1MB
